<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&amp;family=Quicksand:wght@600;700&amp;display=swap"
          rel="stylesheet"/>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<!-- TopNavBar -->
<nav class="navbar navbar-expand-md bg-surface-container-lowest sticky-top shadow-sm py-0" style="height: 112px;">
    <div class="container-xl px-3 px-md-4 h-100 d-flex align-items-center">
        <!-- Brand Logo -->
        <a class="navbar-brand py-0 me-auto" href="#">
            <img alt="Segunda Chance Logo"
                 src="https://lh3.googleusercontent.com/aida/AP1WRLvuGegKSrDxkXbcBPrGZGRagE7c-PwbR_9IegpUnbJyjE_nwfW4TebWrXG5D4jSyD8cAeOQjquOhwfC2vKjbLrhfjiVx-iR9Uy0Zx7HsTm3_1yzIq5eZF4cJ181DzPDDXIzEaFL6yIhN56BmOuoygK_uw8HlYpvZrMb0bbdB3zoAvzdhCXXqeCNldyiot_f-vYXPuONdmjAqJUgS9a8LUIQA9JoyMd58fNXFuCKnNNLwW4dBACNyG_pYA"/>
        </a>
        <!-- Mobile Menu Button -->
        <button aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation"
                class="navbar-toggler border-0 shadow-none text-on-surface-variant" data-bs-target="#navbarContent"
                data-bs-toggle="collapse" type="button">
            <span class="material-symbols-outlined" style="font-size: 28px;">menu</span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
            <!-- Navigation Links -->
            <ul class="navbar-nav me-4 mb-2 mb-md-0 gap-3 gap-md-4">
                <li class="nav-item">
                    <a aria-current="page" class="nav-link nav-link-active pb-1 px-0" href="{{ url_for('home') }}">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom pb-1 px-0" href="{{ url_for('adocao') }}">Adotar</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom pb-1 px-0" href="{{ url_for('denuncia') }}">Denunciar</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom pb-1 px-0" href="{{ url_for('ongs') }}">Para ONGs</a>
                </li>
            </ul>
            <!-- Actions -->
            <div class="d-flex align-items-center gap-3">
                <a class="text-primary text-decoration-none fw-semibold" href="#">Entrar</a>
                <a class="btn-custom-primary shadow-ambient hover-lift" href="{{ url_for('cadastro') }}">Cadastrar</a>
            </div>
        </div>
    </div>
</nav>
<div class="conteudo">
    {% block conteudo %}

    {% endblock %}
</div>
<!-- Bootstrap JS -->
<script crossorigin="anonymous" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
